<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>DEVFLIX</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <h1 class="logo">Dev<span>FLIX</span></h1>
    </header>
    <section class="form-container">
        <h2>Cadastrar Novo Filme</h2>
        <form method="POST" class="form-filme">
            <input type="text" name="titulo" placeholder="Nome do Filme" required>
            <input type="text" name="genero" placeholder="Genero" required>
            <!-- Alterado aqui para "ano_lancamento" (sem acento) -->
            <input type="date" name="ano_lancamento" placeholder="Data lançamento" required>
            <input type="number" name="nota" placeholder="Nota" required>
            <input type="text" name="capa_url" placeholder="URL da capa">

            <button type="submit" class="btn-save">
                Salvar Filme
            </button>
        </form>
        <a href="{{ url_for('listar_filmes') }}" class="btn-back">
            Voltar ao catalogo
        </a>
    </section>
</body>
</html>
